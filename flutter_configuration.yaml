name: facecard
description: FaceCard - "Find what suits you." A modern, premium personal style report application analyzing face shapes and undertones for dress colors, glasses, and hairstyles.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # REST API Client & Utilities
  http: ^1.2.0
  cupertino_icons: ^1.0.5
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

